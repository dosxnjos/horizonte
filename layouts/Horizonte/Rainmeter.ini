; Layout "Horizonte" do Rainmeter: os 5 widgets do pacote, em px lógicos (Rainmeter DPI-unaware).
; Medido para um monitor principal de 2048 x 864 lógicos com barra de 48: coluna Relógio + Dia em
; X=0 a partir de Y=197; Agenda numa coluna própria em X=454; Máquina e Claude em X=858.
; Instalar e reverter: docs/widgets.md § Layout. Ajuste fino: arraste o widget (Draggable=1).
[Rainmeter]

[Horizonte\Relogio]
Active=1
WindowX=0
WindowY=197
ClickThrough=0
Draggable=1
SnapEdges=1
KeepOnScreen=1
AlwaysOnTop=-2

[Horizonte\Dia]
