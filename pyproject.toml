[project]
name = "horizonte"
version = "0.1.0"
description = "Helper agenda_sync do pacote Horizonte: baixa iCal, expande recorrência e grava agenda.json"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "keyring>=25.7.0",
    "recurring-ical-events>=3.8.2",
    "tomli-w>=1.2.0",
    "truststore>=0.10.4",
    "tzdata>=2026.4",
]

[project.scripts]
agenda-sync = "agenda_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agenda_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
