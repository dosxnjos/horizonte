[Rainmeter]
; Horizonte\Claude: anel da janela 5h da conta ativa do claude-usage-tray + barras das contas inativas
; (docs/widgets.md § Claude). SÓ LÊ o snapshot.json da bandeja: nunca cswap nem API (roadmap § 1).
; Update=1000 é só o relógio do Lua (virada do minuto e releitura a cada ReleituraClaudeS); meters e
; measures não se atualizam sozinhos (DefaultUpdateDivider=-1): o Lua redesenha só quando algo muda.
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultUpdateDivider=-1
ContextTitle=Abrir a bandeja do Claude
ContextAction=[!CommandMeasure mLeitor "AbrirBandeja()"]
ContextTitle2=Reler o snapshot
ContextAction2=[!CommandMeasure mLeitor "Recarregar()"]
ContextTitle3=Repetir a entrada
ContextAction3=[!CommandMeasure mLeitor "Entrada()"]

[Metadata]
Name=Horizonte Claude
Author=dosxnjos
Information=Anel da janela de 5h da conta Claude ativa (mesmas cores e zoom da bandeja) e barras 5h/7d das contas inativas, lidos do snapshot.json do claude-usage-tray.
License=MIT
Version=0.1.0

[Variables]
@Include1=#@#Variaveis.inc
@Include2=#@#Tokens.inc
@Include3=#@#Estilos.inc

; ---------------------------------------------------------------- measures

[mAT]
Measure=Plugin
Plugin=ActionTimer
; teto de ~30 s: o Lua manda Stop 1 assim que nada anima; o Update() religa se a lista acabar sozinha
ActionList1=Repeat Passo, 30, 1000
Passo=[!CommandMeasure mLeitor "Passo()"][!UpdateMeasure mAT]

[mLeitor]
; Nome igual ao dos outros widgets: Recarregar() relê o snapshot e o agenda.json (só ambiente.animacoes).
Measure=Script
ScriptFile=#CURRENTPATH#Claude.lua
UpdateDivider=1

[mTray]
; 1 = processo da bandeja rodando, -1 = ausente. Só é atualizado (pelo Lua) quando o savedAt passa de
; TrayParadoS: com a bandeja viva, o savedAt pode envelhecer até 10 min no recuo do 429.
Measure=Process
ProcessName=Claude Usage Tray.exe

; ---------------------------------------------------------------- estilos locais
; Geometria em px lógicos do protótipo: cartão 330 de largura (altura pelo Lua), anel de 136 em
; (24,59), coluna lateral em x=180 com 126 de largura, legenda em y=211.

[EstDig]
; dígito do número grande (40 px, Display 700), dentro da máscara Masc
FontFace=#FonteDisplay#
FontWeight=700
FontSize=(40*0.75*#Scale#)
FontColor=#CorOn#
StringAlign=Center
AntiAlias=1
X=0
Y=0
Text=
Container=Masc
Group=GA

[EstNome]
FontFace=#FonteDisplay#
FontWeight=650
FontSize=(15*0.75*#Scale#)
FontColor=#CorOn#
AntiAlias=1
X=(180*#Scale#)
Y=0
Text=
Group=GP
Hidden=1

[EstTag]
FontFace=#FonteTexto#
FontWeight=500
FontSize=(12.5*0.75*#Scale#)
FontColor=#CorOnV#
AntiAlias=1
ClipString=1
X=0
Y=0
W=(80*#Scale#)
H=(18*#Scale#)
Text=
Group=GP
Hidden=1

[EstRot]
FontFace=#FonteTexto#
FontSize=(12.5*0.75*#Scale#)
FontColor=#CorOnV#
AntiAlias=1
ClipString=1
X=(180*#Scale#)
Y=0
H=(18*#Scale#)
Text=
Group=GP
Hidden=1

[EstBarra]
Shape=Rectangle 0,0,0,0 | StrokeWidth 0 | Fill Color 0,0,0,0
Shape2=Rectangle 0,0,0,0 | StrokeWidth 0 | Fill Color 0,0,0,0
X=0
Y=0
Group=GP
Hidden=1

[EstVal]
FontFace=#FonteMono#
FontWeight=600
FontSize=(12.5*0.75*#Scale#)
FontColor=#CorOn#
StringAlign=Right
AntiAlias=1
X=(306*#Scale#)
Y=0
Text=
Group=GP
Hidden=1

; ---------------------------------------------------------------- meters

[Cartao]
Meter=Shape
Shape=Rectangle 0,0,(330*#Scale#),(254*#Scale#),(#RaioCartao#*#Scale#) | Fill Color #CorS# | StrokeWidth 0
Group=GL

[Titulo]
Meter=String
MeterStyle=EstDisplay
X=(24*#Scale#)
Y=(24.8*#Scale#)
FontWeight=650
FontSize=(15*0.75*#Scale#)
FontColor=#CorOnV#
Text=Claude

[Anel]
; disco (cookie/sol), trilho, indicador e ponto marcador do zoom; strings geradas por anel.lua
Meter=Shape
X=(24*#Scale#)
Y=(59*#Scale#)
Shape=Rectangle 0,0,0,0 | StrokeWidth 0 | Fill Color 0,0,0,0
Shape2=Rectangle 0,0,0,0 | StrokeWidth 0 | Fill Color 0,0,0,0
Shape3=Rectangle 0,0,0,0 | StrokeWidth 0 | Fill Color 0,0,0,0
Shape4=Rectangle 0,0,0,0 | StrokeWidth 0 | Fill Color 0,0,0,0
Disco=0,0 | LineTo 0,0
Group=GA

[Masc]
; Máscara dos dígitos (Container): faixa de 1,1 em (44 px) com degradê de 12 % em cima e embaixo.
Meter=Shape
X=(24*#Scale#)
Y=(105*#Scale#)
Shape=Rectangle 0,0,(136*#Scale#),(44*#Scale#) | Fill LinearGradient GradMasc | StrokeWidth 0
GradMasc=90 | 255,255,255,0 ; 0.0 | 255,255,255,255 ; 0.12 | 255,255,255,255 ; 0.88 | 255,255,255,0 ; 1.0
Group=GA

; três pares de dígitos: S = o que sai, E = o que entra; 1 = o da direita
[DS1]
Meter=String
MeterStyle=EstDig
[DE1]
Meter=String
MeterStyle=EstDig
[DS2]
Meter=String
MeterStyle=EstDig
[DE2]
Meter=String
MeterStyle=EstDig
[DS3]
Meter=String
MeterStyle=EstDig
[DE3]
Meter=String
MeterStyle=EstDig

[Uni]
Meter=String
FontFace=#FonteDisplay#
FontWeight=650
FontSize=(16.8*0.75*#Scale#)
FontColor=#CorOn#,179
AntiAlias=1
X=0
Y=(125*#Scale#)
Text=
Group=GA

[Cap]
; idade do dado ("há 47 min"): só com dado velho ou bandeja parada, e aí sempre visível
Meter=String
FontFace=#FonteTexto#
FontWeight=600
FontSize=(11.5*0.75*#Scale#)
FontColor=#CorOnV#
StringAlign=Center
AntiAlias=1
X=(92*#Scale#)
Y=(149*#Scale#)
Text=
Group=GA

[Hit]
; hover no anel: a coluna da direita mostra todas as barras da conta ativa (5h, 7d, Fable).
; Alfa 1, não 0: pixel 100 % transparente não recebe o mouse.
Meter=Shape
X=(24*#Scale#)
Y=(59*#Scale#)
Shape=Rectangle 0,0,(136*#Scale#),(136*#Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
MouseOverAction=[!CommandMeasure mLeitor "Hover(1)"]
MouseLeaveAction=[!CommandMeasure mLeitor "Hover(0)"]
Group=GA

; Coluna da direita: até 4 cabeçalhos de conta (nome + etiqueta) e 8 linhas (rótulo, barra, valor).
[Nm1]
Meter=String
MeterStyle=EstNome
[Tg1]
Meter=String
MeterStyle=EstTag
[Nm2]
Meter=String
MeterStyle=EstNome
[Tg2]
Meter=String
MeterStyle=EstTag
[Nm3]
Meter=String
MeterStyle=EstNome
[Tg3]
Meter=String
MeterStyle=EstTag
[Nm4]
Meter=String
MeterStyle=EstNome
[Tg4]
Meter=String
MeterStyle=EstTag

[Rl1]
Meter=String
MeterStyle=EstRot
[Rb1]
Meter=Shape
MeterStyle=EstBarra
[Rv1]
Meter=String
MeterStyle=EstVal
[Rl2]
Meter=String
MeterStyle=EstRot
[Rb2]
Meter=Shape
MeterStyle=EstBarra
[Rv2]
Meter=String
MeterStyle=EstVal
[Rl3]
Meter=String
MeterStyle=EstRot
[Rb3]
Meter=Shape
MeterStyle=EstBarra
[Rv3]
Meter=String
MeterStyle=EstVal
[Rl4]
Meter=String
MeterStyle=EstRot
[Rb4]
Meter=Shape
MeterStyle=EstBarra
[Rv4]
Meter=String
MeterStyle=EstVal
[Rl5]
Meter=String
MeterStyle=EstRot
[Rb5]
Meter=Shape
MeterStyle=EstBarra
[Rv5]
Meter=String
MeterStyle=EstVal
[Rl6]
Meter=String
MeterStyle=EstRot
[Rb6]
Meter=Shape
MeterStyle=EstBarra
[Rv6]
Meter=String
MeterStyle=EstVal
[Rl7]
Meter=String
MeterStyle=EstRot
[Rb7]
Meter=Shape
MeterStyle=EstBarra
[Rv7]
Meter=String
MeterStyle=EstVal
[Rl8]
Meter=String
MeterStyle=EstRot
[Rb8]
Meter=Shape
MeterStyle=EstBarra
[Rv8]
Meter=String
MeterStyle=EstVal

[Leg]
; "5h, produto, renova 14:59 (em 22 min)": o começo (rótulo e conta) em 600 na cor do texto; o Lua
; ajusta o InlinePattern ao tamanho desse começo. Quebra linha em 282 px; a altura do cartão segue.
Meter=String
FontFace=#FonteTexto#
FontSize=(13.5*0.75*#Scale#)
FontColor=#CorOnV#
AntiAlias=1
ClipString=2
X=(24*#Scale#)
Y=(211*#Scale#)
W=(282*#Scale#)
InlineSetting=Weight | 600
InlinePattern=^.{0}
InlineSetting2=Color | #CorOn#
InlinePattern2=^.{0}
Text=
Group=GL

[Bloco]
; "bandeja parada": bloco cinza no lugar da legenda; o clique abre o TrayExe (ação posta pelo Lua)
Meter=Shape
X=(24*#Scale#)
Y=(211*#Scale#)
Shape=Rectangle 0,0,(282*#Scale#),(40*#Scale#),(14*#Scale#) | Fill Color #ClaudeVelho#,72 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure mLeitor "AbrirBandeja()"]
Group=GL
Hidden=1

[BlocoTxt]
Meter=String
FontFace=#FonteTexto#
FontSize=(13.5*0.75*#Scale#)
FontColor=#CorOn#
AntiAlias=1
ClipString=2
X=(38*#Scale#)
Y=(221*#Scale#)
W=(254*#Scale#)
InlineSetting=Weight | 600
InlinePattern=^bandeja parada
LeftMouseUpAction=[!CommandMeasure mLeitor "AbrirBandeja()"]
Text=
Group=GL
Hidden=1
