[Rainmeter]
; Horizonte\Agenda: lista dos próximos 14 dias, vãos livres de hoje, saúde das fontes e modo
; privado (docs/widgets.md § Agenda). Update=1000 só para notar a virada do minuto; os meters não
; se atualizam sozinhos (DefaultUpdateDivider=-1): o Lua manda !UpdateMeter/!Redraw quando algo muda.
; A janela acompanha a altura da lista (DynamicWindowSize=1): o cartão é desenhado pelo Lua.
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultUpdateDivider=-1
ContextTitle=Recarregar agenda
ContextAction=[!CommandMeasure mLeitor "Recarregar()"]
ContextTitle2=Modo privado (liga/desliga)
ContextAction2=[!CommandMeasure mLeitor "AlternarPrivado()"]
ContextTitle3=Repetir a entrada
ContextAction3=[!CommandMeasure mLeitor "Entrada()"]

[Metadata]
Name=Horizonte Agenda
Author=dosxnjos
Information=Próximos 14 dias agrupados por dia, vãos livres de hoje, séries diárias colapsadas, saúde de cada fonte e modo privado. Lê agenda.json.
License=MIT
Version=0.1.0

[Variables]
; Padrões da Agenda ANTES dos @Include: assim o Local.inc (incluído por último) pode sobrescrever.
; Máximo de eventos na lista (cabeçalhos de dia e vãos não contam); o resto vira "mais N eventos até dd/mm".
MaxItems=8
; Vão livre mínimo (minutos) entre dois eventos de hoje para ganhar a linha "livre 15:30 às 17:30, 2h".
VaoMin=45
; Dias da lista além de hoje ("Próximos 14 dias" = hoje até hoje+14).
DiasLista=14
; Fontes que não ocupam linha (o feriado já está no chip do Relógio). Lista separada por vírgula.
FontesOcultas=feriados
@Include1=#@#Variaveis.inc
@Include2=#@#Tokens.inc
@Include3=#@#Estilos.inc

; ---------------------------------------------------------------- measures

[mAT]
Measure=Plugin
Plugin=ActionTimer
; 30 ms entre passos (~25 quadros/s reais): a lista inteira é redesenhada a cada !Redraw, então
; metade dos quadros do Dia corta o custo de uma troca de lista toda sem degrau visível em 330 ms.
ActionList1=Repeat Passo, 30, 80
Passo=[!CommandMeasure mLeitor "Passo()"][!UpdateMeasure mAT]

[mLeitor]
; Nome fixo: o agenda_sync manda !CommandMeasure mLeitor "Recarregar()" depois de gravar.
Measure=Script
ScriptFile=#CURRENTPATH#Agenda.lua
UpdateDivider=1

; ---------------------------------------------------------------- estilos locais
; Geometria em px lógicos do protótipo (cartão 380 px; padding 22/16/18; linha 38 px).
; Posição, cor, texto e alfa de cada linha vêm do Lua; aqui ficam os valores de partida.

[EstBg]
X=0
Y=0
Hidden=1

[EstTm]
X=(24*#Scale#)
Y=0
StringAlign=LeftCenter
FontSize=(13*0.75*#Scale#)
FontColor=#CorOnV#,0
Hidden=1

[EstTt]
X=(118*#Scale#)
Y=0
W=(200*#Scale#)
StringAlign=LeftCenter
ClipString=1
FontWeight=550
FontSize=(15*0.75*#Scale#)
FontColor=#CorOn#,0
Hidden=1

[EstRo]
X=0
Y=0
StringAlign=RightCenter
FontSize=(12.5*0.75*#Scale#)
FontColor=#CorOnV#,0
Hidden=1

[EstIcone]
X=0
Y=0
StringAlign=CenterCenter
FontFace=Segoe Fluent Icons
FontSize=(14*0.75*#Scale#)
FontColor=#CorOnV#,0
AntiAlias=1
Hidden=1

; ---------------------------------------------------------------- cartão e cabeçalho

[Cartao]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,(380*#Scale#),(100*#Scale#),(32*#Scale#) | Fill Color #CorS# | StrokeWidth 0
Group=Cab

[Titulo]
Meter=String
MeterStyle=EstDisplay
X=(24*#Scale#)
Y=(42*#Scale#)
StringAlign=LeftCenter
FontWeight=650
FontSize=(15*0.75*#Scale#)
FontColor=#CorOnV#,0
Text=Próximos 14 dias
Group=Cab

[Saude1]
; ponto de saúde de cada fonte (cor e ToolTipText vêm do Lua)
Meter=Shape
X=0
Y=0
Shape=Ellipse 0,0,0 | StrokeWidth 0
Group=Cab
Hidden=1
[Saude2]
Meter=Shape
X=0
Y=0
Shape=Ellipse 0,0,0 | StrokeWidth 0
Group=Cab
Hidden=1
[Saude3]
Meter=Shape
X=0
Y=0
Shape=Ellipse 0,0,0 | StrokeWidth 0
Group=Cab
Hidden=1
[Saude4]
Meter=Shape
X=0
Y=0
Shape=Ellipse 0,0,0 | StrokeWidth 0
Group=Cab
Hidden=1

[Cadeado]
; botão do modo privado: 40 x 40, raio 20 (aberto) ou 12 (fechado); fundo e raio vêm do Lua.
; O meter fica na posição do botão (forma em coordenadas locais): o retângulo do meter é a área do
; tooltip, e com X=0,Y=0 ele cobriria o título.
Meter=Shape
X=(316*#Scale#)
Y=(22*#Scale#)
Shape=Rectangle 0,0,(40*#Scale#),(40*#Scale#),(20*#Scale#) | Fill Color #CorOn#,20 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure mLeitor "AlternarPrivado()"]
ToolTipText=Modo privado
Group=Cab

[CadeadoIcone]
Meter=String
X=(336*#Scale#)
Y=(42*#Scale#)
StringAlign=CenterCenter
FontFace=Segoe Fluent Icons
FontSize=(17*0.75*#Scale#)
FontColor=#CorOnV#,0
AntiAlias=1
Text=[\xE785]
Group=Cab

; ---------------------------------------------------------------- faixa de erro (topo da lista)

[ErroBg]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,0,0 | StrokeWidth 0
Group=Erro
Hidden=1

[ErroTx]
; uma linha por problema; a primeira frase de cada linha sai em negrito
Meter=String
MeterStyle=EstTexto
X=(50*#Scale#)
Y=0
W=(300*#Scale#)
ClipString=2
FontSize=(13.5*0.75*#Scale#)
FontColor=#CorOn#,0
InlineSetting=Weight | 650
InlinePattern=(?m)^[^.\n]*\.
Group=Erro
Hidden=1

; ---------------------------------------------------------------- linhas da lista
; 26 slots genéricos (cabeçalho de dia, evento, vão, "nada mais hoje", "mais N"). Cada slot:
; Bg (fundo do hover + ponto da agenda + pílula "agora" + pontilhado do vão; clique abre o link),
; Tm (hora), Tt (título/rótulo), Ro (rótulo da série: "seg a sex"), Rc (♻), Vd (vídeo: abre o meet).

[Bg1]
Meter=Shape
MeterStyle=EstBg
Shape=Rectangle 0,0,0,0 | StrokeWidth 0
Group=S1
MouseOverAction=[!CommandMeasure mLeitor "Sobre(1)"]
MouseLeaveAction=[!CommandMeasure mLeitor "Sobre(-1)"]
[Tm1]
Meter=String
MeterStyle=EstMono | EstTm
Group=S1
[Tt1]
Meter=String
MeterStyle=EstTexto | EstTt
Group=S1
[Ro1]
Meter=String
MeterStyle=EstTexto | EstRo
Group=S1
[Rc1]
Meter=String
MeterStyle=EstIcone
Text=[\xE895]
ToolTipText=recorrente
Group=S1
[Vd1]
Meter=String
MeterStyle=EstIcone
Text=[\xE714]
ToolTipText=Entrar na videochamada
Group=S1

