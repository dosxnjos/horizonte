[Rainmeter]
; Horizonte\Dia: cartão AGORA / PRÓXIMO / LIVRE + linha do dia (docs/widgets.md § Dia).
; Update=1000 só para notar a virada do minuto; os meters não se atualizam sozinhos
; (DefaultUpdateDivider=-1): o Lua manda !UpdateMeter/!Redraw quando algo muda.
Update=1000
AccurateText=1
DynamicWindowSize=0
DefaultUpdateDivider=-1
SkinWidth=(430*#Scale#)
SkinHeight=(290*#Scale#)
ContextTitle=Recarregar agenda
ContextAction=[!CommandMeasure mLeitor "Recarregar()"]
ContextTitle2=Repetir a entrada
ContextAction2=[!CommandMeasure mLeitor "Entrada()"]

[Metadata]
Name=Horizonte Dia
Author=dosxnjos
Information=Cartão que muda de papel (próximo, urgente, agora, livre) e linha do dia com a agulha do agora e o reset do Claude. Lê agenda.json e o snapshot.json do claude-usage-tray.
License=MIT
Version=0.1.0

[Variables]
@Include1=#@#Variaveis.inc
@Include2=#@#Tokens.inc
@Include3=#@#Estilos.inc
; Regras do cartão (minutos). Próximo a mais de LivreMin vira LIVRE ("livre até 15:00, 2h");
; até EmMin o rótulo diz "em 23 min", depois "às 16:00"; URGENTE a UrgenteMin; Entrar acende a AcendeMin.
LivreMin=120
EmMin=60
UrgenteMin=15
AcendeMin=10
; Faixa padrão da linha do dia (horas). Alarga até o 1º/último evento; de madrugada vira 00–24.
LinhaDe=7
LinhaAte=21
; Releitura do snapshot.json do tray (s). O tray grava a cada ~20 s; o Dia só usa o ResetsAt.
ReleituraSnapS=60

; ---------------------------------------------------------------- measures

[mAT]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Passo, 16, 120
Passo=[!CommandMeasure mLeitor "Passo()"][!UpdateMeasure mAT]

[mLeitor]
; Nome fixo: o agenda_sync manda !CommandMeasure mLeitor "Recarregar()" depois de gravar.
Measure=Script
ScriptFile=#CURRENTPATH#Dia.lua
UpdateDivider=1

; ---------------------------------------------------------------- meters
; Geometria em px lógicos (protótipo: cartão 430 px, padding 26/28). Tudo que muda com o estado
; (cor, raio, posição do texto) é escrito pelo Lua; aqui ficam só os valores de partida.

[Cartao]
; Shape = fundo (Path com 4 raios); Shape2 = "acendimento" (branco que sobe e some ao entrar em AGORA)
Meter=Shape
X=0
Y=0
Contorno=0,0 | LineTo 1,0 | LineTo 1,1 | ClosePath 1
Shape=Path Contorno | Fill Color #CorSHi# | StrokeWidth 0
Shape2=Path Contorno | Fill Color 255,255,255,0 | StrokeWidth 0

[Kick]
Meter=String
MeterStyle=EstDisplay
X=(28*#Scale#)
Y=(48*#Scale#)
StringAlign=LeftCenter
FontWeight=600
FontSize=(16*0.75*#Scale#)
FontColor=#CorOn#,0

[Titulo]
; LeftMouseUpAction (abre o link do evento) e ToolTipText vêm do Lua
Meter=String
MeterStyle=EstDisplay
X=(28*#Scale#)
Y=(89*#Scale#)
W=(374*#Scale#)
StringAlign=LeftCenter
ClipString=1
FontWeight=700
FontSize=(32*0.75*#Scale#)
FontColor=#CorOn#,0
InlineSetting=CharacterSpacing | 0 | -0.64 | 0

[Meta1]
Meter=String
MeterStyle=EstTexto
X=(28*#Scale#)
Y=(127*#Scale#)
StringAlign=LeftCenter
FontSize=(14*0.75*#Scale#)
FontColor=#CorOn#,0

[Meta2]
Meter=String
MeterStyle=EstMono
X=(28*#Scale#)
Y=(127*#Scale#)
StringAlign=LeftCenter
FontSize=(14*0.75*#Scale#)
FontColor=#CorOn#,0

[Meta3]
Meter=String
MeterStyle=EstTexto
X=(28*#Scale#)
Y=(127*#Scale#)
StringAlign=LeftCenter
FontSize=(14*0.75*#Scale#)
FontColor=#CorOn#,0

[Meta4]
; ícone de recorrente (Segoe Fluent Icons, Sync)
Meter=String
X=(28*#Scale#)
Y=(127*#Scale#)
StringAlign=LeftCenter
FontFace=Segoe Fluent Icons
FontSize=(13*0.75*#Scale#)
FontColor=#CorOn#,0
AntiAlias=1
ToolTipText=recorrente

[Onda]
; progresso ondulado do AGORA: Path da onda, trilho e ponto final (coordenadas absolutas)
Meter=Shape
X=0
Y=0
OndaP=0,0 | LineTo 1,0
Shape=Path OndaP | StrokeWidth (5*#Scale#) | Stroke Color 0,0,0,0 | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
Shape2=Line 0,0,1,0 | StrokeWidth 0 | Stroke Color 0,0,0,0
Shape3=Ellipse 0,0,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Hidden=1

[Botao]
; Entrar: círculo apagado (só o ícone) até AcendeMin; pílula acesa com rótulo no AGORA.
; X, Y, Shape (em coordenadas locais: o retângulo do meter é a área do tooltip), LeftMouseUpAction e
; ToolTipText vêm do Lua.
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Hidden=1

[BotaoMasc]
; máscara (Container) do rótulo: mesma pílula do Botao, opaca. Faz o papel do clip-path do protótipo:
; enquanto a pílula cresce, "Entrar" só aparece dentro dela. Container não é desenhado.
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,1,1 | Fill Color 255,255,255,255 | StrokeWidth 0

[BotaoRotulo]
Meter=String
Container=BotaoMasc
MeterStyle=EstTexto
X=(306*#Scale#)
Y=(48*#Scale#)
StringAlign=LeftCenter
FontWeight=600
FontSize=(15*0.75*#Scale#)
FontColor=0,0,0,0
Text=Entrar
Hidden=1

[BotaoIcone]
Meter=String
X=(384*#Scale#)
Y=(48*#Scale#)
StringAlign=CenterCenter
FontFace=Segoe Fluent Icons
FontSize=(18*0.75*#Scale#)
FontColor=0,0,0,0
AntiAlias=1
Text=[\xE714]
Hidden=1

[Linha]
; linha do dia: trilho, blocos (até 12), marca do reset do Claude e agulha. Coordenadas absolutas.
Meter=Shape
X=0
Y=0
Shape=Line 0,0,1,0 | StrokeWidth 0 | Stroke Color 0,0,0,0

[HoraBase]
; estilo dos rótulos de hora (X, texto e alinhamento vêm do Lua)
Y=(239.5*#Scale#)
StringAlign=CenterCenter
FontSize=(10.5*0.75*#Scale#)
FontColor=#CorOn#,0
Group=Horas
Hidden=1

[Hora1]
Meter=String
MeterStyle=EstMono | HoraBase
[Hora2]
Meter=String
MeterStyle=EstMono | HoraBase
[Hora3]
Meter=String
MeterStyle=EstMono | HoraBase
[Hora4]
Meter=String
MeterStyle=EstMono | HoraBase
[Hora5]
Meter=String
MeterStyle=EstMono | HoraBase
[Hora6]
Meter=String
MeterStyle=EstMono | HoraBase
[Hora7]
Meter=String
MeterStyle=EstMono | HoraBase
[Hora8]
Meter=String
MeterStyle=EstMono | HoraBase
[Hora9]
Meter=String
MeterStyle=EstMono | HoraBase

[Reset]
; ♻ do reset da janela 5h do Claude (conta ativa). X e ToolTipText vêm do Lua.
Meter=String
X=0
Y=(193*#Scale#)
StringAlign=CenterCenter
FontFace=Segoe Fluent Icons
FontSize=(11*0.75*#Scale#)
FontColor=#CorOn#,0
AntiAlias=1
Text=[\xE895]
Hidden=1

[AvisoIcone]
Meter=String
X=(28*#Scale#)
Y=(262*#Scale#)
StringAlign=LeftCenter
FontFace=Segoe Fluent Icons
FontSize=(12*0.75*#Scale#)
FontColor=#CorOn#,0
AntiAlias=1
Text=[\xE7BA]
Hidden=1

[AvisoTexto]
Meter=String
MeterStyle=EstTexto
X=(46*#Scale#)
Y=(262*#Scale#)
W=(356*#Scale#)
StringAlign=LeftCenter
ClipString=1
FontSize=(12*0.75*#Scale#)
FontColor=#CorOn#,0
Hidden=1
