[Rainmeter]
; Horizonte\Relogio: hora, data em pt-BR e chip do próximo feriado (docs/widgets.md).
; Update=1000 só para notar a virada do minuto; os meters não se atualizam sozinhos
; (DefaultUpdateDivider=-1): o Lua manda !UpdateMeter/!Redraw quando algo muda.
Update=1000
AccurateText=1
DynamicWindowSize=0
DefaultUpdateDivider=-1
SkinWidth=(430*#Scale#)
SkinHeight=(217*#Scale#)
ContextTitle=#TxtRecarregarAgenda#
ContextAction=[!CommandMeasure mLeitor "Recarregar()"]
ContextTitle2=#TxtRepetirEntrada#
ContextAction2=[!CommandMeasure mLeitor "Entrada()"]

[Metadata]
Name=Horizonte Relógio
Author=dosxnjos
Information=Clock of the Horizonte suite: HH:MM with rolling digits, date (pt-BR) and a chip with the next holiday from agenda.json (or demo data). Settings: @Resources\Settings.inc
License=MIT
Version=1.0.0

[Variables]
@Include1=#@#Variaveis.inc
@Include2=#@#Tokens.inc
@Include3=#@#Estilos.inc
; Geometria do relógio (px lógicos; o Lua multiplica por #Scale#). Medida no protótipo a 112 px.
; Centro de cada dígito (H, H, M, M) e do dois-pontos; o slot (máscara) é mais largo que o
; dígito e os slots se sobrepõem: cada máscara só corta os próprios dígitos, nunca o vizinho.
DigCx1=81.2
DigCx2=140.0
DigCx3=227.0
DigCx4=285.8
DoisPontosCx=186.9
SlotL=84
MascY=26
MascH=123
; Y do String do dígito dentro da máscara (repouso) e passo da rolagem
DigY=-12.4
DigPasso=123

; ---------------------------------------------------------------- measures

[mAT]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Passo, 16, 120
Passo=[!CommandMeasure mLeitor "Passo()"][!UpdateMeasure mAT]

[mLeitor]
; Nome fixo: o agenda_sync manda !CommandMeasure mLeitor "Recarregar()" depois de gravar.
Measure=Script
ScriptFile=#CURRENTPATH#Relogio.lua
UpdateDivider=1

; ---------------------------------------------------------------- meters

[Pilula]
Meter=Shape
Shape=Rectangle 0,0,(430*#Scale#),(217*#Scale#),(108.5*#Scale#) | Fill Color #CorPri# | StrokeWidth 0

[ChipFundo]
; Shape, X e ToolTipText vêm do Lua (largura do texto; nome do feriado)
Meter=Shape
X=0
Y=(159*#Scale#)
Shape=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Hidden=1

[ChipTexto]
Meter=String
MeterStyle=EstChip
X=0
Y=(165.3*#Scale#)
FontColor=#CorOnPri#
Hidden=1

[Data]
Meter=String
MeterStyle=EstDisplay
X=(52*#Scale#)
Y=(161*#Scale#)
FontWeight=600
FontSize=(18*0.75*#Scale#)
FontColor=#CorOnPri#,0

[DoisPontos]
Meter=String
MeterStyle=EstDigito
X=(#DoisPontosCx#*#Scale#)
Y=((#MascY#+#DigY#-6.7)*#Scale#)
FontSize=(112*0.75*#Scale#)
FontColor=#CorOnPri#,#AlfaDoisPontos#
Text=:

; Máscaras: o alfa do Shape vira o alfa do conteúdo. Degradê de 12 % em cima e embaixo, como
; o mask-image do protótipo, para o dígito sumir macio na borda do slot.
[Masc1]
Meter=Shape
X=((#DigCx1#-#SlotL#/2)*#Scale#)
Y=(#MascY#*#Scale#)
Shape=Rectangle 0,0,(#SlotL#*#Scale#),(#MascH#*#Scale#) | Fill LinearGradient GradMasc | StrokeWidth 0
GradMasc=90 | 255,255,255,0 ; 0.0 | 255,255,255,255 ; 0.12 | 255,255,255,255 ; 0.88 | 255,255,255,0 ; 1.0

[Masc2]
Meter=Shape
X=((#DigCx2#-#SlotL#/2)*#Scale#)
Y=(#MascY#*#Scale#)
Shape=Rectangle 0,0,(#SlotL#*#Scale#),(#MascH#*#Scale#) | Fill LinearGradient GradMasc | StrokeWidth 0
GradMasc=90 | 255,255,255,0 ; 0.0 | 255,255,255,255 ; 0.12 | 255,255,255,255 ; 0.88 | 255,255,255,0 ; 1.0

[Masc3]
Meter=Shape
X=((#DigCx3#-#SlotL#/2)*#Scale#)
Y=(#MascY#*#Scale#)
Shape=Rectangle 0,0,(#SlotL#*#Scale#),(#MascH#*#Scale#) | Fill LinearGradient GradMasc | StrokeWidth 0
GradMasc=90 | 255,255,255,0 ; 0.0 | 255,255,255,255 ; 0.12 | 255,255,255,255 ; 0.88 | 255,255,255,0 ; 1.0

[Masc4]
Meter=Shape
X=((#DigCx4#-#SlotL#/2)*#Scale#)
Y=(#MascY#*#Scale#)
Shape=Rectangle 0,0,(#SlotL#*#Scale#),(#MascH#*#Scale#) | Fill LinearGradient GradMasc | StrokeWidth 0
GradMasc=90 | 255,255,255,0 ; 0.0 | 255,255,255,255 ; 0.12 | 255,255,255,255 ; 0.88 | 255,255,255,0 ; 1.0

; Dígitos: dois Strings por slot. "Sai" é o dígito antigo subindo; "Entra" é o novo vindo de baixo.
; Em repouso, só o "Entra" tem texto. X/Y relativos à máscara (Container).
[DigBase]
X=(#SlotL#/2*#Scale#)
Y=(#DigY#*#Scale#)
FontSize=(112*0.75*#Scale#)
FontColor=#CorOnPri#
Group=Digitos

[D1Sai]
Meter=String
MeterStyle=EstDigito | DigBase
Container=Masc1

[D1Entra]
Meter=String
MeterStyle=EstDigito | DigBase
Container=Masc1

[D2Sai]
Meter=String
MeterStyle=EstDigito | DigBase
Container=Masc2

[D2Entra]
Meter=String
MeterStyle=EstDigito | DigBase
Container=Masc2

[D3Sai]
Meter=String
MeterStyle=EstDigito | DigBase
Container=Masc3

[D3Entra]
Meter=String
MeterStyle=EstDigito | DigBase
Container=Masc3

[D4Sai]
Meter=String
MeterStyle=EstDigito | DigBase
Container=Masc4

[D4Entra]
Meter=String
MeterStyle=EstDigito | DigBase
Container=Masc4
