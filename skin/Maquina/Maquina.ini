[Rainmeter]
; Horizonte\Maquina: anéis de CPU, RAM, GPU e discos (docs/widgets.md § Máquina).
; Update=1000 é só o relógio do Lua: os measures e os meters não se atualizam sozinhos
; (DefaultUpdateDivider=-1). O Lua lê os measures na cadência dele (1 s na tomada, BateriaCadenciaS
; na bateria) e só redesenha quando o valor MOSTRADO muda (CPU/GPU de 5 em 5, RAM de 1 em 1).
; A largura depende de quantos discos a lista Discos tem: o cartão é desenhado pelo Lua.
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultUpdateDivider=-1
ContextTitle=Gerenciador de Tarefas
ContextAction=["taskmgr"]
ContextTitle2=Monitor de Recursos
ContextAction2=["resmon"]
ContextTitle3=Repetir a entrada
ContextAction3=[!CommandMeasure mLeitor "Entrada()"]

[Metadata]
Name=Horizonte Máquina
Author=dosxnjos
Information=Anéis de CPU, RAM, GPU e discos (GB livres), neutros em repouso e coloridos só quando pedem atenção.
License=MIT
Version=0.1.0

[Variables]
@Include1=#@#Variaveis.inc
@Include2=#@#Tokens.inc
@Include3=#@#Estilos.inc

; ---------------------------------------------------------------- measures
; Todos com UpdateDivider=-1 (herdado): quem chama !UpdateMeasure é o Lua.

[mAT]
Measure=Plugin
Plugin=ActionTimer
; 1000 repetições (~35 s) só como teto: o Lua manda Stop 1 assim que nenhum anel anima. Se a lista
; acabar sozinha com anel animando, o Update() (1 Hz) religa.
ActionList1=Repeat Passo, 30, 1000
Passo=[!CommandMeasure mLeitor "Passo()"][!UpdateMeasure mAT]

[mLeitor]
; Nome igual ao dos outros widgets: Recarregar() relê o agenda.json (só ambiente.animacoes).
Measure=Script
ScriptFile=#CURRENTPATH#Maquina.lua
UpdateDivider=1

[mCpu]
; "% Processor Utility" bate com o Gerenciador de Tarefas (passa de 100 no turbo: o Lua limita).
Measure=Plugin
Plugin=UsageMonitor
Category=Processor Information
Counter=% Processor Utility
Name=_Total

[mCpuReserva]
; Reserva se o contador acima não existir (o Lua troca sozinho e o tooltip diz "aprox.").
Measure=CPU

[mRam]
Measure=PhysicalMemory

[mRamTotal]
Measure=PhysicalMemory
Total=1

[mGpu]
; O contador "GPU Engine" (Alias=GPU) tem centenas de instâncias e o UsageMonitor o consulta numa
; thread própria enquanto o measure apontar para ele, lido ou não: ~3,5 pontos de um núcleo parado
; (medido em 02/10). Em repouso aponta para o contador barato do mCpu; o Lua troca para Alias=GPU
; Index=0 por 2 s a cada 10 s (30 s na bateria), lê e volta (Maquina.lua, gpuCaro/amostrarGpu).
Measure=Plugin
Plugin=UsageMonitor
Category=Processor Information
Counter=% Processor Utility
Name=_Total

[mBateria]
; 1 = na tomada, 0 = na bateria
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE

; Processo mais pesado (hover). Em repouso apontam para o contador barato do mCpu: o UsageMonitor
; consulta a categoria Process (centenas de instâncias, ~2 pontos de um núcleo) mesmo com o measure
; Disabled=1. O Lua troca para Alias=CPU/RAM no MouseOver e volta no MouseLeave (medido em 02/10).
[mTopCpu]
Measure=Plugin
Plugin=UsageMonitor
Category=Processor Information
Counter=% Processor Utility
Name=_Total
Disabled=1

[mTopRam]
Measure=Plugin
Plugin=UsageMonitor
Category=Processor Information
Counter=% Processor Utility
Name=_Total
Disabled=1

; Discos: o Lua põe a unidade (Drive) da lista Discos e liga só os que estão na lista.
[mDisco1]
Measure=FreeDiskSpace
Drive=C:
IgnoreRemovable=0
Disabled=1

[mDisco1Total]
Measure=FreeDiskSpace
Drive=C:
Total=1
IgnoreRemovable=0
Disabled=1

[mDisco2]
Measure=FreeDiskSpace
Drive=C:
IgnoreRemovable=0
Disabled=1

[mDisco2Total]
Measure=FreeDiskSpace
Drive=C:
Total=1
IgnoreRemovable=0
Disabled=1

[mDisco3]
Measure=FreeDiskSpace
Drive=C:
IgnoreRemovable=0
Disabled=1

[mDisco3Total]
Measure=FreeDiskSpace
Drive=C:
Total=1
IgnoreRemovable=0
Disabled=1

; ---------------------------------------------------------------- estilos locais
; Geometria em px lógicos do protótipo (cartão 330 x 187 com 4 anéis; anel 68 px; colunas de 66 px
; com vão de 6). X/Y de cada anel e do texto vêm do Lua; aqui ficam os valores de partida.

[EstAnel]
X=0
Y=(59*#Scale#)
Shape=Rectangle 0,0,0,0 | StrokeWidth 0 | Fill Color 0,0,0,0
Shape2=Rectangle 0,0,0,0 | StrokeWidth 0 | Fill Color 0,0,0,0
Shape3=Rectangle 0,0,0,0 | StrokeWidth 0 | Fill Color 0,0,0,0
Disco=0,0 | LineTo 0,0
Hidden=1

[EstMasc]
; Máscara dos dígitos (Container): faixa de 1,1 em com degradê de 12 % em cima e embaixo.
X=0
Y=(82*#Scale#)
Shape=Rectangle 0,0,(68*#Scale#),(22*#Scale#) | Fill LinearGradient GradMasc | StrokeWidth 0
GradMasc=90 | 255,255,255,0 ; 0.0 | 255,255,255,255 ; 0.12 | 255,255,255,255 ; 0.88 | 255,255,255,0 ; 1.0
Hidden=1

[EstNum]
FontFace=#FonteDisplay#
FontWeight=700
FontSize=(20*0.75*#Scale#)
FontColor=#CorOn#
StringAlign=Center
AntiAlias=1
X=0
Y=0
Text=

[EstUni]
FontFace=#FonteDisplay#
FontWeight=650
FontSize=(8.4*0.75*#Scale#)
FontColor=#CorOn#,179
AntiAlias=1
X=0
Y=0
Text=
Hidden=1

[EstCap]
FontFace=#FonteTexto#
FontWeight=600
FontSize=(12.5*0.75*#Scale#)
FontColor=#CorOn#
StringAlign=Center
AntiAlias=1
X=0
Y=(134.3*#Scale#)
Hidden=1

[EstSub]
FontFace=#FonteTexto#
FontWeight=500
FontSize=(11.5*0.75*#Scale#)
FontColor=#CorOnV#
StringAlign=Center
AntiAlias=1
X=0
Y=(149*#Scale#)
Hidden=1

[EstHit]
; Área do mouse e do clique: alfa 1, não 0 (pixel 100 % transparente não recebe o mouse).
X=0
Y=(55*#Scale#)
Shape=Rectangle 0,0,(66*#Scale#),(112*#Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
Hidden=1

; ---------------------------------------------------------------- meters

[Cartao]
Meter=Shape
Shape=Rectangle 0,0,(330*#Scale#),(187*#Scale#),(#RaioCartao#*#Scale#) | Fill Color #CorS# | StrokeWidth 0

[Titulo]
Meter=String
MeterStyle=EstDisplay
X=(24*#Scale#)
Y=(24.8*#Scale#)
FontWeight=650
FontSize=(15*0.75*#Scale#)
FontColor=#CorOnV#
Text=Máquina

[Dica]
; Linha do hover, à direita do título: "chrome 18%", "maior: msedge 1,9 GB", "80 de 476 GB livres"
Meter=String
MeterStyle=EstTexto
X=(306*#Scale#)
Y=(26*#Scale#)
StringAlign=Right
FontWeight=500
FontSize=(12.5*0.75*#Scale#)
FontColor=#CorOnV#
Text=

; Seis anéis: 1 CPU, 2 RAM, 3 GPU, 4..6 discos da lista. Cada um: Anel (disco, trilho e indicador),
; Masc (máscara dos dígitos), 3 pares de dígitos (S = o que sai, E = o que entra; 1 = o da direita),
; unidade, legenda e sublegenda. Group=G<n> para redesenhar só o anel que mexeu.

